services:
  tq-desk:
    build: .
    image: <your-dockerhub-username>/tq-desk:latest
    container_name: tq-desk
    ports:
      - "8848:8848"
    environment:
      - TZ=Asia/Shanghai
      - TQ_USER=${TQ_USER:-}        # 可选：启动自动登录
      - TQ_PASS=${TQ_PASS:-}
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}